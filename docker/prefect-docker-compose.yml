version: '3.8'

services:
  prefect:
    image: prefecthq/prefect:3.7.4.dev4-python3.12
    container_name: prefect-orion
    environment:
      # Use existing Postgres - Prefect will create its own 'prefect' database
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/prefect
      PREFECT_API_DATABASE_PASSWORD: prefect
      PREFECT_API_URL: http://localhost:4200
      PREFECT_API_DATABASE_USERNAME: postgres
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0

  prefect-worker:
    image: prefecthq/prefect:3.7.4.dev4-python3.12
    container_name: prefect-worker
    environment:
      PREFECT_API_URL: http://prefect:4200
      PREFECT_WORKER_NAME: ingestion-worker
      PREFECT_WORKER_WORK_QUEUE_NAME: default
    depends_on:
      - prefect
    command: prefect worker start --type process --name ingestion-worker

volumes:
  prefect_data:

networks:
  default:
    name: prefect_network
