<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2 style="color: #2c3e50;">You were mentioned</h2>
    <p>
        <strong>@{{ mentioned_by_user_id }}</strong>{% if mentioned_by_name %} ({{ mentioned_by_name }}){% endif %} mentioned {{ target_label }}
        in a comment on the <em>{{ expert_name }}</em> expert task.
    </p>
    <table style="border-collapse: collapse; width: 100%; max-width: 600px;">
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Comment</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ comment_text }}</td>
        </tr>
    </table>
    <p style="margin-top: 20px;">
        <a href="{{ comment_url }}"
           style="background-color: #2c3e50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">
            View Comment
        </a>
    </p>
</body>
</html>
