<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2 style="color: #2c3e50;">Regulatory Circular</h2>
    <table style="border-collapse: collapse; width: 100%; max-width: 600px;">
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Circular ID</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ circular_id }}</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Title</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ title }}</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Department</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ department }}</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Issue Date</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ issue_date }}</td>
        </tr>
        <tr>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Source</strong></td>
            <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ source }}</td>
        </tr>
    </table>
    <p style="margin-top: 20px;">
        <a href="{{ url }}" style="background-color: #3498db; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">View Circular</a>
    </p>
</body>
</html>
