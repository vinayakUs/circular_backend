<div class="personas-page">

  <main class="main-content">
    <header class="page-header">
      <h1 class="page-title">Personas</h1>
      <p class="page-subtitle">
        Choose a role to see only the circulars that matter to you. Each persona
        filters circulars by relevant departments and categories across all exchanges.
      </p>
    </header>

    <div class="loading-state" *ngIf="loading">
      <div class="loading-spinner"></div>
      <p>Loading personas...</p>
    </div>

    <div class="error-state" *ngIf="!loading && error">
      <p>{{ error }}</p>
    </div>

    <section class="personas-grid" *ngIf="!loading && !error">
      <a
        *ngFor="let persona of personas; let i = index"
        class="persona-card"
        [style.--stagger]="i"
        [routerLink]="['/personas', persona.slug]"
      >
        <div class="persona-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path [attr.d]="iconPath(persona.icon)" />
          </svg>
        </div>
        <h2 class="persona-name">{{ persona.name }}</h2>
        <p class="persona-description">{{ persona.description }}</p>
        <div class="persona-exchanges">
          <span class="exchange-chip" *ngFor="let src of uniqueSources(persona)">
            {{ src }}
          </span>
        </div>
      </a>
    </section>
  </main>
</div>
