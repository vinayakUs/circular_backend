<div class="modal-overlay" (click)="close.emit()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>Add Task</h3>
            <button class="modal-close" (click)="close.emit()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="pdf-viewer-section" (contextmenu)="$event.preventDefault()" (mouseup)="onPdfMouseUp($event)">
                <div class="pdf-container">
                    <ngx-extended-pdf-viewer *ngIf="!isLoadingExperts; else loadingExperts"
                        (pdfLoaded)="onPdfLoaded()"
                        (annotationLayerRendered)="onEvent('annotationLayerRendered', $event)" [src]="pdfUrl"
                        [showToolbar]="true" [showSidebarButton]="false" [showFindButton]="false"
                        [showPagingButtons]="false" [showSignatureEditor]="false" [page]="1" [showDrawEditor]="false"
                        [showCommentEditor]="false" [showStampEditor]="false" [showTextEditor]="false"
                        [showPresentationModeButton]="false" [showOpenFileButton]="false" [showPrintButton]="false"
                        [showDownloadButton]="false" [showSecondaryToolbarButton]="true" [showMovePageButton]="false"
                        [showRotateButton]="false" [showRotateCwButton]="false" [showRotateCcwButton]="false"
                        [showHandToolButton]="false" [showScrollingButtons]="false" [showSpreadButton]="false"
                        [showPropertiesButton]="false" [showBorders]="false" [textLayer]="true" [handTool]="false"
                        (annotationEditorEvent)="onAnnotationEvent($event)">
                    </ngx-extended-pdf-viewer>
                    <ng-template #loadingExperts>
                        <div class="loading-full">
                            <div class="spinner"></div>
                            <span>Loading...</span>
                        </div>
                    </ng-template>
                    <div class="restoring-overlay" *ngIf="isRestoringHighlights">
                        <div class="spinner"></div>
                        <span>Loading highlights...</span>
                    </div>
                </div>
                <div class="empty-section">
                    <div class="experts-list">
                        <h4>Tagged Tasks</h4>
                        <div *ngIf="isLoadingExperts">
                            <div class="loading-spinner">Loading tasks...</div>
                        </div>
                        <div class="experts-list-content"
                            *ngIf="!isLoadingExperts && experts.length > 0; else noExperts">
                            <div class="expert-card" *ngFor="let expert of experts; let i = index" (click)="navigateToHighlight(i)">
                                <div class="expert-header">
                                    <input class="expert-name-input" type="text" [(ngModel)]="expert.title"
                                        placeholder="Task name" />
                                    <button class="remove-btn" (click)="removeExpert(i)">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div class="expert-text">
                                    <span class="highlight-text">"{{ expert.text }}"</span>
                                </div>
                                <div class="dept-selector">
                                    <div class="dept-chips">
                                        <span *ngFor="let deptId of expert.dept_ids" class="dept-chip">
                                            {{ getDeptName(deptId) }}
                                            <button type="button" class="chip-x" (click)="removeDepartment(i, deptId)">×</button>
                                        </span>
                                        <button type="button" class="dept-btn"
                                            (click)="openDeptDropdownIndex = openDeptDropdownIndex === i ? null : i">
                                            <span *ngIf="expert.dept_ids.length === 0">Assign Department</span>
                                            <span *ngIf="expert.dept_ids.length > 0">Add Department</span>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2">
                                                <polyline points="6 9 12 15 18 9"></polyline>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="dept-dropdown" *ngIf="openDeptDropdownIndex === i">
                                        <div class="dept-option" *ngFor="let dept of departments"
                                            [class.selected]="isDeptSelected(i, dept.id)"
                                            (click)="toggleDepartment(i, dept.id)">
                                            <span class="dept-check">{{ isDeptSelected(i, dept.id) ? '✓' : '' }}</span>
                                            {{ dept.name }}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <ng-template #noExperts>
                            <p class="no-data">No tasks tagged yet. Highlight text to add.</p>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" (click)="close.emit()">Cancel</button>
            <button class="btn btn-primary" (click)="onSave()" [disabled]="isSaving">
                <span *ngIf="isSaving">Saving...</span>
                <span *ngIf="!isSaving">Save</span>
            </button>
        </div>
    </div>
</div>
